name: Docker Build and Push

on:
  push:
    branches: [ master ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set short SHA
      id: short-sha
      run: echo "sha=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ety001/lzc-story:latest
          ety001/lzc-story:latest-${{ steps.short-sha.outputs.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Output docker tags
      run: |
        echo "Docker tags:"
        echo "  - ety001/lzc-story:latest"
        echo "  - ety001/lzc-story:latest-${{ steps.short-sha.outputs.sha }}"